<!doctype html>
<!--
  data-cf-product picks the accent ramp and data-cf-substrate the ash ramp, both from
  @cloudsforge/ui/tokens.css. They are on <html> and set STATICALLY here rather than by React,
  because a page that paints before the attributes land flashes the default ember and then changes
  colour.

  'network' — NOT 'explorer', and this was checked rather than assumed.

  tokens.css has no `[data-cf-product='explorer']` block. It has `[data-cf-product='network']` at
  `ui/packages/ui/src/tokens.css:340`, carrying #d6412f — which is the exact accent the registry
  gives this surface (`ui/packages/ui/src/surfaces.ts:444`), because an explorer is part of Forge
  Network rather than a brand of its own (`brand/plan.ts:50-62`).

  Setting 'explorer' here would have fallen through to the company ember in complete silence.
  platform/apps/admin/index.html did exactly that for as long as nobody looked, and tokens.css says
  so at `:389-396` — "a silent fallthrough is a latent bug, so every key an app may set is
  declared". `explorer` is the key that is still missing one; reported to micro-ui, and
  test/brand-chrome.test.ts asserts that the selector this file names really exists.

  'warm' is the ash ramp every product frontend in the estate uses.
-->
<html lang="en-GB" data-cf-product="network" data-cf-substrate="warm">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="colour-scheme" content="dark" />
    <!--
      The build that produced this bundle. Stamped by the Dockerfile, read by src/lib/obs.ts, and
      the reason an error report can be pinned to the deploy that introduced it. It is an identity
      rather than a configuration: it names the artefact, it does not tell it where it is running.
    -->
    <meta name="cf-release" content="dev" />

    <!--
      The description says what the surface is AND what it will not claim, in the same sentence,
      because this string is the one that ends up in a search result. An explorer that implied
      finality would be misleading in the place a reader is least able to check.
    -->
    <meta
      name="description"
      content="Blocks, transactions, addresses and chain state on the CloudsForge networks. Every depth is shown with the head it was measured against, and nothing here is called final."
    />

    <!--
      Brand chrome for the `explorer` surface, from micro-brand's assets/explorer/ set, copied
      byte-identical — test/brand-chrome.test.ts compares the bytes in both directions.

      THERE IS NO MARK AND NO WORDMARK, AND THAT IS A DECISION. `explorer` carries `markId: null` in
      the registry (`ui/packages/ui/src/surfaces.ts:446`) and brand/assets/explorer/ deliberately
      holds favicons and an og card only — the two artefacts a separate hostname needs, because
      "a browser tab and a shared link inherit nothing" (`brand/plan.ts:50-62`). Nothing here links
      a mark, nothing in src renders one, and the test asserts the absence so that generating one
      later is a decision rather than a reflex.

      This surface DOES ship an og card. A block explorer's links are pasted into chat and support
      tickets constantly, which is the whole argument brand/plan.ts makes for giving a public child
      surface one. 18-build-status.md §3.3k drew the opposite conclusion only for the operator
      console, which nobody shares outward.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />

    <!--
      ONE og block, not two. foresight-web/index.html declares og:type, og:title and og:description
      twice — the second set silently wins in every crawler and the first is dead text nobody
      edits. Reported there; not repeated here, and test/brand-chrome.test.ts counts each property.

      The image is a RELATIVE path so the card resolves against whichever origin served the page,
      which is the same rule the rest of this bundle follows for hosts.

      The description makes no claim about finality or confirmation. A card is read WITHOUT the
      surrounding page, so it is the easiest place on the whole surface to imply certainty by
      accident.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Network Explorer" />
    <meta
      property="og:description"
      content="Blocks, transactions, addresses and chain state on the CloudsForge networks. Depth is shown with what it was measured against."
    />
    <meta property="og:image" content="/og-1200x630.png" />

    <title>Network Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
