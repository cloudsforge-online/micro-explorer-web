<!doctype html>
<!--
  data-cf-product picks the accent ramp and data-cf-substrate the ash ramp, both from
  @cloudsforge/ui/tokens.css. They are on <html> and set STATICALLY here rather than by React,
  because a page that paints before the attributes land flashes the default ember and then changes
  colour.

  'network' — NOT 'explorer', and this was checked rather than assumed.

  tokens.css has no `[data-cf-product='explorer']` block. It has `[data-cf-product='network']` at
  `ui/packages/ui/src/tokens.css`, carrying #d6412f — which is the exact accent the registry
  gives this surface (`ui/packages/ui/src/surfaces.ts`), because an explorer is part of Forge
  Network rather than a brand of its own (`brand/plan.ts`).

  Setting 'explorer' here would have fallen through to the company ember in complete silence.
  platform/apps/admin/index.html did exactly that for as long as nobody looked, and tokens.css says
  so — "a silent fallthrough is a latent bug, so every key an app may set is
  declared". `explorer` is the key that is still missing one; reported to micro-ui, and
  test/brand-chrome.test.ts asserts that the selector this file names really exists.

  'warm' is the ash ramp every product frontend in the estate uses.

  data-cf-scheme is the THIRD of the three attributes, added with @cloudsforge/ui 1.1. `auto`
  follows the reader's operating system; `light` and `dark` force one. It is set here, statically,
  for exactly the reason the other two are — a page that paints before the attribute lands flashes
  one palette and then changes to the other.

  It does NOT change which accent block applies. `network` above still names
  `[data-cf-product='network']`, which in 1.1 carries a `-dark` and a `-light` hex
  (`ui/packages/ui/src/tokens.css`) and lets the scheme pick between them. So this surface
  is served in a light environment for the first time without a single colour being chosen here.
-->
<html lang="en-GB" data-cf-product="network" data-cf-substrate="warm" data-cf-scheme="auto">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      `color-scheme`, spelled the way the standard spells it.

      This was `colour-scheme` — correct English, and INERT. It is not a registered meta name, so
      no browser has ever read it, and the declaration meant to tell the browser which form
      controls and scrollbars to draw did nothing at all. On this surface that is not cosmetic:
      the front page IS a form — a chain `<select>` and the paste box every reader types a hash
      into — and both were drawn with light chrome on a dark page in every browser that honours
      the real name.

      Both schemes are declared rather than only `dark`, because `data-cf-scheme="auto"` above
      means the token layer now resolves whichever palette the reader's system asks for. Declaring
      only `dark` would leave the chrome the browser draws disagreeing with the page around it —
      which is the same defect as before, in the other direction.
    -->
    <meta name="color-scheme" content="dark light" />
    <!--
      The build that produced this bundle. Stamped by the Dockerfile, read by src/lib/obs.ts, and
      the reason an error report can be pinned to the deploy that introduced it. It is an identity
      rather than a configuration: it names the artefact, it does not tell it where it is running.
    -->
    <meta name="cf-release" content="dev" />
    <!--
      THE GOOGLE ANALYTICS MEASUREMENT ID, AND NOT THE GOOGLE ANALYTICS TAG.
      ────────────────────────────────────────────────────────────────────────────────────────
      There is deliberately no third-party analytics `<script src=…>` in this file, and there must
      never be one — the tag's own domain is not even spelled out here, so a grep for it over this
      file returns nothing and the absence is checkable rather than asserted. The stock snippet
      fetches that script and sets `_ga` on load, before any banner has been drawn, let alone
      answered; under ePrivacy Art. 5(3) an analytics cookie set before consent is a violation that
      a banner underneath it does not cure. `@cloudsforge/ui/consent` injects the tag from exactly
      one place: the Accept button in `CookieBanner`. See the header of that module.

      It matters here for a reason particular to a block explorer. The addresses on this surface
      ARE the reader's data: `/tx/<chain>/<network>/<hash>` names one transaction, and a page view
      reported with its path attached tells a third party which transaction a given browser looked
      up. So the gate in front of the tag is not a formality on this surface; it is the difference
      between counting readers and describing them.

      It is a meta tag rather than a build-time variable because test/no-build-time-config.test.ts
      greps for those and fails the build — an artefact with an environment frozen into it is not
      the artefact that passed CI. (That test greps this file too, which is why the prefix it looks
      for is not written out here.) It is the same mechanism `cf-release` above already uses, and
      the ID is an identity rather than a configuration: it names the property, it does not tell
      the bundle where it is running. An absent or empty value means analytics is simply off, which
      is what a local `pnpm dev` gets.
    -->
    <meta name="cf-analytics" content="G-ZFBLKK519K" />

    <!--
      The description says what the surface is AND what it will not claim, in the same sentence,
      because this string is the one that ends up in a search result. An explorer that implied
      finality would be misleading in the place a reader is least able to check.
    -->
    <meta
      name="description"
      content="Blocks, transactions, addresses and chain state on the CloudsForge networks. Every depth is shown with the head it was measured against, and nothing here is called final."
    />

    <!--
      Brand chrome for the `explorer` surface, from micro-brand's assets/explorer/ set, copied
      byte-identical — test/brand-chrome.test.ts compares the bytes in both directions.

      THERE IS NO MARK AND NO WORDMARK, AND THAT IS A DECISION. `explorer` carries `markId: null` in
      the registry (`ui/packages/ui/src/surfaces.ts`) and brand/assets/explorer/ deliberately
      holds favicons and an og card only — the two artefacts a separate hostname needs, because
      "a browser tab and a shared link inherit nothing" (`brand/plan.ts`). Nothing here links
      a mark, nothing in src renders one, and the test asserts the absence so that generating one
      later is a decision rather than a reflex.

      This surface DOES ship an og card. A block explorer's links are pasted into chat and support
      tickets constantly, which is the whole argument brand/plan.ts makes for giving a public child
      surface one. 18-build-status.md §3.3k drew the opposite conclusion only for the operator
      console, which nobody shares outward.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/favicon-192x192.png" />

    <!--
      ONE og block, not two. foresight-web/index.html declares og:type, og:title and og:description
      twice — the second set silently wins in every crawler and the first is dead text nobody
      edits. Reported there; not repeated here, and test/brand-chrome.test.ts counts each property.

      The image is a RELATIVE path so the card resolves against whichever origin served the page,
      which is the same rule the rest of this bundle follows for hosts.

      The description makes no claim about finality or confirmation. A card is read WITHOUT the
      surrounding page, so it is the easiest place on the whole surface to imply certainty by
      accident.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Network Explorer" />
    <meta
      property="og:description"
      content="Blocks, transactions, addresses and chain state on the CloudsForge networks. Depth is shown with what it was measured against."
    />
    <meta property="og:image" content="/og-1200x630.png" />

    <title>Network Explorer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
