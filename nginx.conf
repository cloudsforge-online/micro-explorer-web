# The Network Explorer's server block.
#
# THE ONE THING TO UNDERSTAND HERE: an unknown path answers 404, not 200.
#
# The usual SPA fallback is `try_files $uri /index.html`, which serves the bundle with a 200 for
# every address in existence. That makes a "page not found" screen a success: search engines index
# it, uptime checks call it healthy, link checkers pass, and a deploy that drops a route looks
# exactly like a deploy that did not.
#
# That is worse on this surface than on most. A block explorer's addresses are the strings people
# paste into chat, cite in a support ticket and link from a receipt —
# `/tx/ember/testnet/0x…`, `/blocks/ember/testnet/1481920`. A mistyped one answering 200 would be
# indistinguishable from a real one to every machine that ever looks at it.
#
# So the client routes are ENUMERATED below, and everything else falls through to
# `error_page 404 /index.html`, which serves the same bundle while KEEPING the 404 status. React
# renders NotFoundPage inside it, and the status line tells the truth.
#
# The cost is that this list and `ROUTES` in src/lib/routes.ts must agree. That is one line per
# route, paid once per route, and `test/routes.test.ts` reads this file and fails the build when
# they drift. "Remember to update nginx.conf" is not a mechanism; a test is.
#
# ── There is no proxy in this file, and that is deliberate ────────────────────────────────────
#
# In production this bundle and `micro-indexer` share `explorer.<apex>` and the API requests are
# relative, exactly as trade-web and trade share `trade.<apex>`. Routing `/v1` to the indexer is
# the gateway's job (`deploy/gateway/dynamic/policy.yml`), not this container's.
#
# A `proxy_pass` here that added an `Authorization` header would make the explorer publicly
# readable — and would put a CloudsForge service credential inside an image that is built once and
# promoted, which is a published credential. See the header of src/lib/indexer.ts for the whole of
# that reasoning. Whatever closes the authority gap, it is not this file.

# ── IS THIS HOSTNAME AN ENVIRONMENT OTHER THAN MAINNET? ────────────────────────────────────────
#
# `map` is in http context, which is why it sits above the server block rather than inside it —
# a conf.d file is included in http, so this is legal here and would not be legal ten lines down.
#
# THE LABELS ARE `ENV_LABELS` FROM @cloudsforge/ui, and test/sitemap.test.ts reads that export and
# fails if this alternation has drifted from it. They are the words that name an environment rather
# than a surface: `surfaces.ts` reserves them so no surface may take one as a subdomain, and
# `deploy/scripts/check-apex-prefix.py` enforces that.
#
# THIS IS THE SAME QUESTION `src/lib/network.ts` ASKS, ASKED BY THE OTHER HALF OF THE STACK, and
# they must not disagree. The bundle derives which network it is serving from `window.location
# .hostname` through the registry's `splitEnvLabel`; this derives whether a crawler is welcome from
# `$host`. Two deployments of one image sit on two hostnames, one holding real EMBER and one
# holding test EMBER — and testnet pages competing with mainnet ones in a search index is worse
# here than on a marketing site, because the pages in question are transaction records that look
# exactly like the record of a payment somebody is trying to confirm. A reader who searches for
# their transaction hash and lands on the testnet explorer is told it does not exist. That is
# tracker #136 arriving by a third route, and `Disallow: /` is what closes it.
#
# `(?:[^.]+-)?` catches BOTH shapes, for the same reason `networkForHost()` resolves both. The
# environment is a suffix on the first label now (`explorer-testnet.<apex>`) and was an apex prefix
# before (`testnet.<apex>`, which put this surface at the two-label `explorer.testnet.<apex>` —
# unreachable, because Cloudflare's Universal SSL is a one-label wildcard and every two-label name
# fails the handshake at the edge). Both are matched here or half the estate stays indexable.
map $host $cf_env {
    default '';
    ~^(?:[^.]+-)?(?:testnet|staging|preview|dev|mainnet)\. 'yes';
}

server {
    # 8080 because the image is nginx-unprivileged: nothing in this container is root, and a
    # non-root process cannot bind 80. This is a fact about the IMAGE only — the registry's
    # devPort for `explorer` is 4008, the indexer this bundle reads, after briefly echoing this
    # number and thereby telling the app to ask itself for chain data.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing is real routing: the address must survive a hard refresh.
    absolute_redirect off;

    # ---- security headers ------------------------------------------------
    # SAMEORIGIN rather than DENY: this is a public reference surface with legitimate same-origin
    # embeds inside Hub and the Forge Network site, unlike the operator console, which has none and
    # uses DENY.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- assets ----------------------------------------------------------
    # Immutable, because every build emits new hashed filenames. A missing asset is a 404 on its
    # own terms and must NOT fall through to the app shell: a JavaScript request answered with
    # HTML fails with a syntax error that names the wrong file.
    location /assets/ {
        try_files $uri =404;
        # REPEATED, NOT INHERITED. nginx's `add_header` is all-or-nothing per level: a location
        # that declares ANY add_header inherits NONE from its parent. So every location below that
        # sets Cache-Control must restate the security headers, or it silently serves without them
        # — which is exactly what `location /assets/` did in the template, stripping nosniff from
        # every hashed script in every frontend cut from it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html is never cached. It is the file that names the current asset hashes, so a stale
    # copy pins a browser to a deploy that no longer exists.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the client routes, enumerated -----------------------------------
    # Keep in step with ROUTES in src/lib/routes.ts. test/routes.test.ts reads both.
    location = / {
        try_files /index.html =404;
        # `try_files` is a FILE LOOKUP, not an internal redirect, so serving /index.html here does
        # NOT re-enter `location = /index.html` above — and this location therefore has to declare
        # the shell's no-store itself. Without it `/` shipped with no Cache-Control at all, which
        # is the one document that must never be cached: it names the hashed bundle.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    location ~ ^/(chains|blocks|tx|address|tokens)(/|$) {
        try_files /index.html =404;
        # Same reason as `location = /` above: try_files does not re-enter, so restate them all.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-store" always;
    }

    # ---- the sitemap and robots.txt, emitted with $host -------------------
    # THEY ARE HERE RATHER THAN IN public/ FOR THE ONE REASON THAT DECIDES IT: a sitemap must carry
    # ABSOLUTE URLs — the spec requires it and a crawler discards a relative `<loc>` — and nothing
    # built in this repository is allowed to name a hostname, because one image is served from
    # localhost, from a preview deployment and from two production estates
    # (test/no-build-time-config.test.ts). nginx is the component that knows: it has `$host` on
    # every request, so the addresses are composed per request and the artefact stays
    # environment-free.
    #
    # ── WHY THIS IS NOT `sitemapXml()` FROM @cloudsforge/ui ──────────────────────────────────
    #
    # THIS SURFACE IS NOT THE APEX. The shared generator composes every sibling as
    # `<subdomain>.$host`, which is exactly right on the marketing site, where `$host` IS the apex.
    # Here `$host` is already `explorer.<apex>`, so the same generator would emit
    # `network.explorer.<apex>` — a two-label hostname that resolves to nothing and fails the
    # edge's one-label wildcard certificate. That is the same dead shape `4283686` had to remove
    # from the contract package's URL builder, and a sitemap of addresses that cannot be connected
    # to is worse than no sitemap: a crawler handed dead URLs by a site's own index discounts the
    # ones that work.
    #
    # So this surface lists ITS OWN public routes and nothing else, and the estate sitemap stays
    # the apex's job. test/sitemap.test.ts checks both directions against `NAV`.
    #
    # ── THE FOUR RECORD ROUTES ARE DELIBERATELY ABSENT ──────────────────────────────────────
    #
    # `/blocks/<chain>/<network>/<height>`, `/tx/…/<hash>`, `/address/…/<address>` and
    # `/tokens/…/<address>` are UNBOUNDED — one address per block, per transaction, per account,
    # minted by the chain and discovered by the index, growing every few seconds. A static list of
    # them in a config file would be a second opinion about which blocks exist that goes stale
    # before the file is saved. They stay reachable from `/`, which is the search box that resolves
    # a paste into one of them, and from `/chains`, and that is what a crawler follows.
    #
    # `/chains/<chain>/<network>` is bounded but is left out for a different reason: which scopes
    # exist is a PER-DEPLOYMENT fact this file cannot read. `/chains` measures it from the index's
    # own `/status` (src/pages/chains.tsx) precisely so it cannot be assumed, and enumerating the
    # scopes here would reintroduce the assumption in the one document a crawler treats as
    # authoritative.
    location = /sitemap.xml {
        # `types { }` empties the mime table FOR THIS LOCATION so `default_type` is what applies.
        # Without it nginx maps the `.xml` in the URI to `text/xml` from its own table and the
        # `default_type` line is inert — a declaration that reads as a decision and is not one.
        types { }
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # An environment that must not be indexed has no sitemap. `return` inside `if` is one of
        # the two uses of `if` in a location that are defined behaviour rather than a trap.
        if ($cf_env) { return 404; }
        return 200 '<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
  <url><loc>$scheme://$host</loc></url>
  <url><loc>$scheme://$host/chains</loc></url>
</urlset>';
    }

    location = /robots.txt {
        types { }
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Every environment but mainnet refuses every crawler, whole.
        if ($cf_env) { return 200 'User-agent: *\nDisallow: /\n'; }
        return 200 'User-agent: *
Allow: /

Sitemap: $scheme://$host/sitemap.xml
';
    }

    # ---- everything else -------------------------------------------------
    # A real file (favicon, the og card) is served; anything else 404s, and the error page below
    # turns that 404 into the app shell WITHOUT changing the status.
    location / {
        try_files $uri =404;
    }

    error_page 404 /index.html;

    # nginx's own health, for the container probe. It answers before the app has been fetched, so
    # it says the server is up — never that the product works. That is Beacon's job, and on this
    # surface a green probe says nothing at all about whether the chain index will answer.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
